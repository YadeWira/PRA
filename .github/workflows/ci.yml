# Every platform PRA supports runs the same check (.github/test.sh).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fpc
      - name: Test
        run: sh .github/test.sh

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fpc
      - name: Test
        run: sh .github/test.sh

  linux-x86:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the 32-bit C library
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libc6:i386 gcc-multilib
      - name: Install the 32-bit Free Pascal
        run: scripts/fpc-i386.sh /tmp/fpc-i386
      - name: Test
        env:
          FPC: /tmp/fpc-i386/fpc
        run: sh .github/test.sh

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        run: brew install fpc
      - name: Test
        run: sh .github/test.sh

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: Test
        shell: bash
        env:
          FPC: fpc -Px86_64
        run: sh .github/test.sh

  windows-x86:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal (win32 and win64)
        shell: pwsh
        run: |
          $url = 'https://sourceforge.net/projects/freepascal/files/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe/download'
          curl.exe -L --fail --retry 3 -o "$env:TEMP\fpc-setup.exe" $url
          Start-Process -Wait -FilePath "$env:TEMP\fpc-setup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          $fpc = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw 'fpc.exe not found after the installer' }
          Split-Path $fpc.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding ascii
      - name: Test
        shell: bash
        env:
          FPC: fpc -Pi386
        run: sh .github/test.sh
